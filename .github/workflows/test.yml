name: Tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2 and export templates
        run: |
          curl -sSL -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP" && sudo mv "$RUNNER_TEMP/Godot_v4.7.2-stable_linux.x86_64" /usr/local/bin/godot
          curl -sSL -o "$RUNNER_TEMP/tpl.tpz" https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -q "$RUNNER_TEMP/tpl.tpz" -d "$RUNNER_TEMP" && mv "$RUNNER_TEMP"/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
      - name: Import
        run: godot --headless --path . --import
      - name: Editor tests
        run: godot --headless --path . res://tests/test_editor.tscn | tee editor.log; grep -q " 0 FALLITI" editor.log
      - name: Mission bricks tests
        run: godot --headless --fixed-fps 60 --path . res://tests/test_mattoncini.tscn | tee mat.log; grep -q " 0 FALLITI" mat.log
      - name: Physics engine tests
        run: godot --headless --fixed-fps 60 --path . res://tests/test_motore.tscn | tee mot.log; grep -q " 0 FALLITI" mot.log
      - name: Full check of every piece (virtual screen)
        run: xvfb-run -a godot --path . res://tests/test_collaudo.tscn | tee col.log; grep -q " 0 FALLITI" col.log
      - name: Official release (local git remote, game compiled from the commit)
        run: godot --headless --path . res://tests/test_rilascio.tscn | tee ril.log; grep -q " 0 FALLITI" ril.log
