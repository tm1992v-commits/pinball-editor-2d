; Le scelte dell'utente (qualità, volumi, comandi) si salvano a parte in user:// e hanno la precedenza.

[fisica]
gravita=950.0                 ; mm/s² lungo il piano (pallina che rotola su piano inclinato di ~6,5°)
velocita_max=3200.0           ; limite di velocità della pallina (mm/s)
rimbalzo_pallina=0.0           ; 23/11: 0, perché Godot SOMMA il rimbalzo della pallina a quello della superficie (studio, D1).
                              ; Così ogni valore qui sotto è il rimbalzo VERO, misurato
attrito_pallina=0.12
rimbalzo_legno=0.45           ; sponde esterne (prima, sommato: 0,60)
rimbalzo_metallo=0.35         ; guide metalliche (prima, sommato: 0,47)
rimbalzo_gomma=0.75           ; paletti e anelli di gomma (prima, sommato: 0,87)
rimbalzo_elastico=0.85        ; i 4 elastici (prima, sommato: 1,0 = tutta l'energia, irreale)
rimbalzo_fionda=0.45          ; fianchi delle fionde (come prima, sommato 0,45)
attrito_gomma=0.5
spinta_bumper=760.0           ; velocità minima in uscita da un bumper
spinta_fionda=680.0
spinta_molla=760.0
paletta_vel_su=26.0           ; rad/s in salita
paletta_vel_giu=13.0          ; rad/s in discesa
paletta_rimbalzo=0.4            ; come prima (0,15 + 0,25 della pallina)
paletta_rimbalzo_ferma=0.25    ; paletta tenuta ferma in alto (come prima, sommato)
paletta_attrito=0.6
rampa_vel_uscita_max=1100.0     ; velocità massima della pallina quando esce da una rampa nella corsia (mm/s)
lancio_min=1350.0              ; 23/11 molla dosata (simulazione): <1350 ricade, ~1450 bumper, ~1500 corsie alte,
lancio_max=2100.0              ; >=1550 giro completo a sinistra. Carica progressiva: v = min + (max-min) x carica^1,5
lancio_curva=1.5
lancio_tempo_carica=1.4        ; secondi per la carica completa (prima 0,9)
kickback=1500.0
rampa_gravita=6500.0          ; decelerazione in salita sulle rampe (per unità di pendenza, ~5/7 g)
rampa_attrito=140.0
rampa_vel_min=280.0
spinta_nudge=160.0
tilt_finestra=1.2             ; due spinte entro questo tempo = avviso
tilt_avvisi=3

[musica]
brani=[]
fonte_musica=""          ; fonte predefinita delle musiche nel registro licenze ("" = da dichiarare)
scelta="casuale"

[regole]
palline=3
salva_pallina=8.0             ; secondi di protezione all'inizio di ogni pallina
; 20/11 pallina extra come nei flipper veri (valori di partenza = STIMA, da regolare provando):
punti_rigioco=1500000         ; 1° punteggio di rigioco: pallina extra (0 = spento)
punti_rigioco_2=4000000       ; 2° punteggio di rigioco: pallina extra
extra_max_pallina=2           ; palline extra al massimo durante una stessa pallina in gioco
extra_max_partita=4           ; palline extra al massimo in una partita
extra_max_accese=2            ; palline extra accese (da raccogliere) al massimo insieme
extra_valore=250000           ; punti dati al posto della pallina extra quando i limiti sono raggiunti
multiball_palline=5           ; palline in campo nei multiball (20/11: erano 3-4)

[grafica]
qualita="bassa"
vetro=true                    ; vetro protettivo con riflesso leggero
fps_massimi=60
visuale="fissa"                ; 2D: una sola visuale fissa con tutto il tavolo
camera_lancio=true             ; la telecamera va vicino alla molla quando si deve lanciare la pallina
scala_3d_telefono=0.65         ; sui telefoni il 3D si disegna al 65% della risoluzione (più fluido)
luci_intensita=1.0             ; forza degli aloni delle luci del tavolo (0,5 = tenui, 1,5 = forti)
segnaposto=false               ; mostra i riquadri degli elementi grafici non ancora fatti

[sistema]
tavolo="base"               ; cartella in tavoli/
schermo_intero=false
strumenti_debug=false

[comandi]
scossa_telefono=true          ; sul telefono: un colpo secco del telefono = scossa (nudge)
soglia_scossa=11.0            ; forza del colpo (m/s²) per contare come scossa

[pubblicita]
fornitore=""
app_id=""
intervallo=180.0              ; secondi minimi tra due pubblicità (solo a fine partita)
prima=60.0                    ; la prima pubblicità può uscire dopo almeno 60 s dall'avvio del gioco
prova=false
